title: RK3588 Edge Vision
subtitle: Real-Time AI Inference System
summary: 基于 C++17、Linux、V4L2、RGA、DMA-BUF 和 RKNN 的边缘实时视觉推理系统，实现目标检测与跟踪。
tags: [C++17, RK3588, INT8 / FP16, DMA-BUF, RKNN, ByteTrack]
defaultBenchmark: hybrid
modelReductionPercent: 42.62
sources:
  repository: https://github.com/ChutianDuan/Yolo
  deployment: https://github.com/ChutianDuan/Yolo/blob/d527fd2ac416e52dbd37e10bbbfaf4ef3f268ab7/README_RK3588.md
  note: /notes/liunx-c-工程化/5-onnx模型导出与部署优化/
  fixesRoot: https://github.com/ChutianDuan/shimeta-rk3588-linux-fixes/tree/10c760515b1e0a3eb90badba7e3193ff1ad495c1
  fixesIssues: https://github.com/ChutianDuan/shimeta-rk3588-linux-fixes/blob/10c760515b1e0a3eb90badba7e3193ff1ad495c1/docs/porting-issues.md
  fixesValidation: https://github.com/ChutianDuan/shimeta-rk3588-linux-fixes/blob/10c760515b1e0a3eb90badba7e3193ff1ad495c1/docs/validation.md
implementation:
  - title: 混合精度量化
    text: 先建立 PTQ INT8 基线，再通过逐层分析将敏感位置保留为 FP16，用 RKNN-Toolkit2 导出固定混合精度模型。
  - title: DMA-BUF 与帧租约
    text: YUYV 采集直接共享给 RGA / RKNN，稳态应用层上传为 0 字节；MJPEG 保留一次压缩包复制，解码后由 MPP / RGA / RKNN 共享图像缓冲。帧租约与 RAII 负责资源归还。
  - title: 三个独立 Worker
    text: 每个 Worker 持有独立的 RKNN Context、RGA 预处理目标和输入输出缓冲，分别绑定 NPU Core0 / 1 / 2，并发处理单路视频的不同帧。
  - title: 有界队列与跟踪输出
    text: 等待槽保留最新帧；YOLO26 检测结合 ByteTrack 校正轨迹，按帧序号和时间水位拒绝迟到结果，JSONL 记录检测、轨迹和运行资源。
