<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">VisionTrack 上传视频与多路实时流流程</title>
  <desc id="desc">图片、上传视频和实时流经共享模型调度、高低分辨率检测、LK 光流与 ByteTrack 处理；上传一次性返回 JSON，实时流通过 SSE 输出并支持有限缓存补发。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 3L0 6Z" fill="#075cff"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f4f7fb"/>
  <rect x="30" y="30" width="900" height="560" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
  <path d="M30 66V30H66" fill="none" stroke="#075cff" stroke-width="8"/>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="60" y="76" fill="#0b0e14" font-size="31" font-weight="700">VisionTrack / YOLO Tracking</text>
    <text x="60" y="104" fill="#667085" font-size="16">共享模型调度 · 高低分辨率检测 · LK / ByteTrack · SSE</text>

    <g text-anchor="middle">
      <rect x="60" y="164" width="150" height="82" fill="#f4f7fb" stroke="#aeb9c8" stroke-width="2"/>
      <text x="135" y="197" fill="#0b0e14" font-size="18" font-weight="700">图片 / 视频 / 流</text>
      <text x="135" y="224" fill="#667085" font-size="13">BDD100K 道路场景</text>

      <path d="M210 205H254" stroke="#075cff" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="266" y="144" width="190" height="122" fill="#eef4ff" stroke="#075cff" stroke-width="2"/>
      <text x="361" y="177" fill="#0b0e14" font-size="18" font-weight="700">调度 / 质量门控</text>
      <text x="361" y="202" fill="#075cff" font-size="13" font-weight="700">QUALITY-AWARE STRIDE</text>
      <text x="361" y="228" fill="#667085" font-size="12">光流质量 · 尺度 / 速度突变</text>
      <text x="361" y="248" fill="#667085" font-size="12">重复轨迹 · 类别冲突 · flow age</text>

      <path d="M456 205H492V163H500M492 205V247H500" fill="none" stroke="#075cff" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="512" y="128" width="188" height="70" fill="#ffffff" stroke="#075cff" stroke-width="2"/>
      <text x="606" y="157" fill="#0b0e14" font-size="17" font-weight="700">High-res YOLO</text>
      <text x="606" y="181" fill="#667085" font-size="12">权威确认 / urgent refresh</text>
      <rect x="512" y="212" width="188" height="70" fill="#ffffff" stroke="#7ea7ff" stroke-width="2"/>
      <text x="606" y="241" fill="#0b0e14" font-size="17" font-weight="700">Low-res YOLO</text>
      <text x="606" y="265" fill="#667085" font-size="12">频繁轻量刷新</text>

      <path d="M700 163H730V205H744M700 247H730V205" fill="none" stroke="#075cff" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="756" y="144" width="144" height="122" fill="#0b0e14" stroke="#0b0e14" stroke-width="2"/>
      <text x="828" y="184" fill="#ffffff" font-size="17" font-weight="700">Authority</text>
      <text x="828" y="207" fill="#ffffff" font-size="17" font-weight="700">Tracker</text>
      <text x="828" y="236" fill="#9ebcff" font-size="12">stable / provisional</text>
      <text x="828" y="254" fill="#9ebcff" font-size="12">去重 / TTL / 冲突处理</text>
    </g>

    <path d="M361 266V318M162 318H798" fill="none" stroke="#aeb9c8" stroke-width="2"/>
    <path d="M162 318V338M374 318V338M586 318V338M798 266V338" fill="none" stroke="#aeb9c8" stroke-width="2"/>

    <g text-anchor="middle">
      <rect x="66" y="338" width="192" height="94" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="162" y="371" fill="#0b0e14" font-size="17" font-weight="700">LK Optical Flow</text>
      <text x="162" y="397" fill="#667085" font-size="12">检测帧之间的短间隔传播</text>
      <text x="162" y="416" fill="#667085" font-size="12">逐轨迹质量门控</text>

      <rect x="278" y="338" width="192" height="94" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="374" y="371" fill="#0b0e14" font-size="17" font-weight="700">Shared Scheduler</text>
      <text x="374" y="397" fill="#667085" font-size="12">共享推理资源 / 请求池</text>
      <text x="374" y="416" fill="#667085" font-size="12">异步回放校正</text>

      <rect x="490" y="338" width="192" height="94" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="586" y="371" fill="#0b0e14" font-size="17" font-weight="700">ByteTrack</text>
      <text x="586" y="397" fill="#667085" font-size="12">Track ID 与生命周期</text>
      <text x="586" y="416" fill="#667085" font-size="12">检测 / 跟踪状态衔接</text>

      <rect x="702" y="338" width="192" height="94" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="798" y="371" fill="#0b0e14" font-size="17" font-weight="700">Observability</text>
      <text x="798" y="397" fill="#667085" font-size="12">timing · queue · /metrics</text>
      <text x="798" y="416" fill="#667085" font-size="12">门禁 / 健康 / 流状态</text>
    </g>

    <rect x="66" y="466" width="828" height="82" fill="#f4f7fb" stroke="#c7d0dc"/>
    <line x1="480" y1="478" x2="480" y2="536" stroke="#dfe4ec"/>
    <text x="86" y="491" fill="#075cff" font-size="14" font-weight="700">UPLOAD VIDEO</text>
    <text x="86" y="514" fill="#0b0e14" font-size="15">有界任务池 → 完整 JSON</text>
    <text x="86" y="536" fill="#667085" font-size="12">请求结束后不保留可查询任务</text>
    <text x="500" y="491" fill="#075cff" font-size="14" font-weight="700">REALTIME STREAMS</text>
    <text x="500" y="514" fill="#0b0e14" font-size="15">/streams → detection / end SSE</text>
    <text x="500" y="536" fill="#667085" font-size="12">最多 256 条缓存补发 · 进程重启不恢复</text>
  </g>
</svg>
