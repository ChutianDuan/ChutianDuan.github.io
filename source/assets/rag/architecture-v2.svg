<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">RAG Gateway Stack 分层架构</title>
  <desc id="desc">浏览器通过 C++ Drogon Gateway 访问 FastAPI 内部服务，下游连接 MySQL、LanceDB、Celery、Redis、Embedding 和 LLM，并支持循环 Agent、三层记忆、citations 与 Trace。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 3L0 6Z" fill="#075cff"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f4f7fb"/>
  <rect x="30" y="30" width="900" height="560" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
  <path d="M30 66V30H66" fill="none" stroke="#075cff" stroke-width="8"/>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="60" y="76" fill="#0b0e14" font-size="31" font-weight="700">RAG Gateway Stack</text>
    <text x="60" y="104" fill="#667085" font-size="16">全局知识库检索 · 异步任务 · 循环 Agent · 可追溯回答</text>

    <g text-anchor="middle">
      <rect x="80" y="132" width="800" height="52" fill="#f4f7fb" stroke="#aeb9c8" stroke-width="2"/>
      <text x="480" y="154" fill="#0b0e14" font-size="18" font-weight="700">Browser / React Workbench</text>
      <text x="480" y="174" fill="#667085" font-size="13">文档 · 任务 · 问答 · citations · Agent Trace · 监控</text>

      <path d="M480 184V210" stroke="#075cff" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="80" y="218" width="800" height="70" fill="#eef4ff" stroke="#075cff" stroke-width="2"/>
      <text x="480" y="246" fill="#0b0e14" font-size="21" font-weight="700">C++ Drogon Gateway</text>
      <text x="480" y="271" fill="#4f5968" font-size="14">Public API · Upload Validation · CORS · Health Aggregation · SSE Proxy</text>

      <path d="M480 288V314" stroke="#075cff" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="80" y="322" width="800" height="92" fill="#ffffff" stroke="#075cff" stroke-width="2"/>
      <text x="480" y="349" fill="#0b0e14" font-size="21" font-weight="700">FastAPI Internal Service</text>
      <line x1="346" y1="361" x2="346" y2="401" stroke="#dfe4ec"/>
      <line x1="614" y1="361" x2="614" y2="401" stroke="#dfe4ec"/>
      <text x="213" y="380" fill="#075cff" font-size="14" font-weight="700">GLOBAL RAG</text>
      <text x="213" y="399" fill="#667085" font-size="12">recall → hydrate → rerank</text>
      <text x="480" y="380" fill="#075cff" font-size="14" font-weight="700">AGENT LOOP</text>
      <text x="480" y="399" fill="#667085" font-size="12">read-only tools · citations</text>
      <text x="747" y="380" fill="#075cff" font-size="14" font-weight="700">MEMORY &amp; TRACE</text>
      <text x="747" y="399" fill="#667085" font-size="12">user · session · recent turns</text>
    </g>

    <path d="M480 414V438M165 438H795" fill="none" stroke="#aeb9c8" stroke-width="2"/>
    <path d="M165 438V452M375 438V452M585 438V452M795 438V452" stroke="#aeb9c8" stroke-width="2"/>

    <g text-anchor="middle">
      <rect x="80" y="452" width="170" height="66" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="165" y="480" fill="#0b0e14" font-size="16" font-weight="700">MySQL</text>
      <text x="165" y="501" fill="#667085" font-size="12">source of truth</text>

      <rect x="290" y="452" width="170" height="66" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="375" y="480" fill="#0b0e14" font-size="16" font-weight="700">LanceDB</text>
      <text x="375" y="501" fill="#667085" font-size="12">vector recall metadata</text>

      <rect x="500" y="452" width="170" height="66" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="585" y="480" fill="#0b0e14" font-size="16" font-weight="700">Celery / Redis</text>
      <text x="585" y="501" fill="#667085" font-size="12">ingest · chat · memory</text>

      <rect x="710" y="452" width="170" height="66" fill="#f4f7fb" stroke="#c7d0dc"/>
      <text x="795" y="480" fill="#0b0e14" font-size="16" font-weight="700">Embedding / LLM</text>
      <text x="795" y="501" fill="#667085" font-size="12">OpenAI-compatible</text>
    </g>

    <rect x="80" y="540" width="800" height="28" fill="#0b0e14"/>
    <text x="480" y="559" fill="#ffffff" font-size="12" text-anchor="middle">INGEST: upload → parse → embed → index  |  CHAT: recall → rerank → answer + citations</text>
  </g>
</svg>
