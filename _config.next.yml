# NexT alternate theme config
# Docs: https://theme-next.js.org/docs/getting-started/configuration.html

scheme: Mist
darkmode: false

custom_file_path:
  head: source/_data/head.njk
  bodyEnd: source/_data/body-end.njk
  postMeta: source/_data/post-meta.njk
  postBodyEnd: source/_data/post-body-end.njk
  style: source/_data/styles.styl

menu:
  首页: / || fa fa-home
  项目: /projects/ || fa fa-code
  知识地图: /archives/ || fa fa-book-open
  关于: /about/ || fa fa-user
  GitHub: https://github.com/ChutianDuan || fab fa-github

menu_settings:
  icons: false
  badges: false

sidebar:
  position: right
  display: post
  padding: 18
  offset: 12

avatar:
  url: /img/me.jpg
  rounded: false
  rotated: false

site_state: true

social:
  GitHub: https://github.com/ChutianDuan || fab fa-github
  E-Mail: mailto:3383006954@qq.com || fa fa-envelope

social_icons:
  enable: true
  icons_only: false
  transition: true

toc:
  enable: true
  number: true
  wrap: true
  expand_all: false
  max_depth: 4

creative_commons:
  license: by-nc-sa
  size: small
  post: false
  language: deed.zh

footer:
  since: 2024
  icon:
    name: fa fa-code
    animated: false
    color: "#075cff"
  powered: false

post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

read_more_btn: true

symbols_count_time:
  separated_meta: true
  item_text_total: false

post_navigation: false

text_align:
  desktop: start
  mobile: start

codeblock:
  copy_button:
    enable: true
    style: flat
  fold:
    enable: false
    height: 500
  language: true

back2top:
  enable: true
  sidebar: true
  scrollpercent: true

reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#075cff"
  height: 3px

bookmark:
  enable: true
  color: "#075cff"
  save: auto

mediumzoom: true

motion:
  enable: false
  async: false
  duration: 200

theme_color:
  light: "#ffffff"
  dark: "#ffffff"

busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

local_search:
  enable: true
  top_n_per_article: 2
  unescape: false
  preload: false

mermaid:
  enable: true
  theme:
    light: default
    dark: dark
